<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>守山大森店 配布マップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  color-scheme: light;
  --A:#C8412F; --B:#E2872B; --C:#4E9AA8;
  --ink:#1f2328; --sub:#5f6368; --faint:#9aa0a6; --line:#e6e8eb; --soft:#f5f6f8;
  --bg:#ffffff; --hit:#FCE38A; --hit-ink:#5a4300;
  --shadow:0 1px 2px rgba(60,64,67,.28),0 2px 8px 2px rgba(60,64,67,.14);
  --panel-w:400px; --peek:132px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",YuGothic,Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#eef0f2;color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0}
.print-only{display:none}

/* ---------- 検索＋フィルタ ---------- */
#topbar{position:absolute;top:12px;left:12px;width:var(--panel-w);z-index:6}
.search{display:flex;align-items:center;height:48px;background:var(--bg);border-radius:24px;box-shadow:var(--shadow);padding:0 4px 0 16px;gap:8px}
.search svg{flex:none;color:var(--sub)}
.search input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--sub);flex:none}
.icon-btn:hover{background:var(--soft)}
#suggest{list-style:none;margin:6px 0 0;padding:6px 0;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);max-height:50vh;overflow:auto}
#suggest button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 16px;border:0;background:none;text-align:left;cursor:pointer;font-size:14px}
#suggest button:hover,#suggest button:focus-visible{background:var(--soft);outline:0}
#suggest .empty{padding:12px 16px;font-size:13px;color:var(--sub)}
#suggest .sub{margin-left:auto;font-size:12px;color:var(--sub)}
.pills{display:flex;gap:5px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:44px;padding:0;border:0;background:none;cursor:pointer}
.pill>span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:17px;background:var(--bg);box-shadow:var(--shadow);font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pill small{font-weight:500;color:var(--sub)}
.pill[aria-pressed="true"]>span{background:#1f2328;color:#fff}
.pill[aria-pressed="true"] small{color:#c9ccd1}
.pill[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff}

/* ---------- パネル（PC=左 / スマホ=ボトムシート） ---------- */
#panel{position:absolute;top:118px;left:12px;bottom:12px;width:var(--panel-w);background:var(--bg);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:5}
#sheetHead{flex:none;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.handle{display:none}
.ptitle{font-size:12px;color:var(--sub)}
.psum{font-size:15px;font-weight:700;margin-top:2px}
.psum b{font-size:18px}
#panelBody{flex:1;min-height:0;display:flex;flex-direction:column}
#card{flex:none;max-height:58%;overflow:auto;padding:14px 16px 14px;border-bottom:8px solid var(--soft)}
#list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.notes-in-panel{display:none}

/* 情報カード */
.card-head{display:flex;gap:12px;align-items:flex-start}
.card-head .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 0 0 3px #fff,0 1px 5px rgba(0,0,0,.35);margin-top:2px}
.card-head h2{margin:0 0 5px;font-size:20px;line-height:1.3}
.card-head .grow{flex:1;min-width:0}
.lbadge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700}
.mai-big{display:flex;align-items:baseline;gap:6px;margin:14px 0 12px}
.mai-big .k{font-size:12px;color:var(--sub);margin-right:4px}
.mai-big b{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mai-big .u{font-size:16px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--soft);border-radius:10px;padding:9px 12px}
.tile.wide{grid-column:1/-1}
.tile .k{font-size:11.5px;color:var(--sub)}
.tile .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}
.tile .v small{font-size:12px;font-weight:600;margin-left:2px}
.tile .s{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
.tile.river .s{color:#1d5f96;font-weight:700}
.tile.hit-on{background:var(--hit)}
.tile.hit-on .k,.tile.hit-on .s{color:var(--hit-ink)}
.tile.hit-off .v{color:var(--faint)}

/* 一覧 */
.grp-head{position:sticky;top:0;z-index:1;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.grp-head .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.grp-head .t .sw{width:14px;height:14px;border-radius:4px}
.grp-head .m{font-size:12px;color:var(--sub);margin-top:3px}
.grp-head .m b{color:var(--ink)}
.grp-head .d{font-size:11.5px;color:var(--sub);margin-top:2px}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;min-height:58px;padding:8px 16px 8px 13px;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:hover{background:var(--soft)}
.row.active{background:#fff5e2;border-left-color:var(--c)}
.row.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:#ffd98a}100%{background:#fff5e2}}
.row .nb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.row .nm{display:block;font-weight:700;font-size:14.5px}
.row .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--sub)}
.chip{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:700;line-height:1.6}
.chip.ratio{background:#eceef1;color:#3c4043}
.chip.hit-on{background:var(--hit);color:var(--hit-ink)}
.chip.hit-off{background:#f1f2f4;color:var(--faint);font-weight:500}
.row .mai{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.row .mai small{font-size:11px;font-weight:600;margin-left:1px;color:var(--sub)}
.grp[hidden]{display:none}

/* 凡例 */
#legend{position:absolute;top:12px;right:12px;width:250px;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);z-index:4;font-size:12px;max-height:calc(100vh - 200px);overflow:auto}
#legend summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;font-weight:800;font-size:13px;cursor:pointer}
#legend summary::-webkit-details-marker{display:none}
#legend summary .chev{transition:none;color:var(--sub)}
#legend[open] summary .chev{transform:rotate(180deg)}
.lg{padding:0 14px 12px}
.lg h4{margin:8px 0 4px;font-size:11px;color:var(--sub);font-weight:700}
.lg .it{display:flex;align-items:center;gap:8px;padding:3px 0;line-height:1.35}
.lg .it svg{flex:none}
.lg .it .n{margin-left:auto;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.lg .it b{font-weight:800}
.lg .desc{font-size:11px;color:var(--sub);margin:-1px 0 4px 26px;line-height:1.4}

/* 右下操作 */
#controls{position:absolute;right:12px;bottom:36px;display:flex;flex-direction:column;gap:10px;z-index:4}
.cgroup{background:var(--bg);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.cgroup .icon-btn{border-radius:0;color:#3c4043}
.cgroup .icon-btn+.icon-btn{border-top:1px solid var(--line)}
.icon-btn:disabled{color:#c4c7cc;cursor:default;background:none}
#compassIcon{transition:none}

/* 注記（フッター） */
#notes{position:absolute;left:calc(var(--panel-w) + 24px);right:72px;bottom:8px;z-index:3;background:rgba(255,255,255,.9);border-radius:8px;padding:6px 10px;font-size:10.5px;line-height:1.55;color:var(--sub);pointer-events:auto}
.notes p{margin:0}
.notes p+p{margin-top:2px}

.maplibregl-ctrl-bottom-right{z-index:3}
.maplibregl-popup-content{font-family:var(--font);border-radius:10px;padding:10px 32px 10px 12px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.55}
.maplibregl-popup-content b{font-size:14px}
.maplibregl-popup-close-button{width:32px;height:32px;font-size:18px}
.pop-sub{color:var(--sub)}
.geo-dot{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.2),0 1px 3px rgba(0,0,0,.4)}

/* ---------- スマホ ---------- */
@media (max-width:767px){
  #topbar{left:8px;right:8px;top:8px;width:auto}
  .pill>span{padding:0 11px}
  .pill .long,.pill small{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:calc(100vh - 64px);height:calc(100dvh - 64px);border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgba(60,64,67,.22);transform:translateY(calc(100vh - 64px - var(--peek)));transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
  #panel.dragging{transition:none}
  #sheetHead{touch-action:none;cursor:grab;padding:6px 16px 10px}
  .handle{display:block;width:40px;height:5px;border-radius:3px;background:#d4d7dc;margin:2px auto 8px}
  #panelBody{display:block;overflow:auto;overscroll-behavior:contain}
  #card{max-height:none;overflow:visible}
  #list{overflow:visible}
  .notes-in-panel{display:block;padding:14px 16px 28px;font-size:10.5px;line-height:1.6;color:var(--sub)}
  #notes{display:none}
  #legend{top:112px;right:8px;width:auto;max-width:calc(100vw - 16px);max-height:calc(100vh - 112px - var(--peek) - 16px)}
  #legend:not([open]){width:auto}
  #legend[open]{width:260px}
  #controls{right:8px;bottom:calc(var(--peek) + 40px)}
  .maplibregl-ctrl-bottom-right{bottom:var(--peek)}
}

/* ---------- 印刷（A3横） ---------- */
@media print{
  @page{size:A3 landscape;margin:8mm}
  html,body{height:auto;overflow:visible;background:#fff}
  #topbar,#panel,#controls,.maplibregl-ctrl-bottom-right,.maplibregl-popup{display:none!important}
  .print-only{display:block}
  #printTitle{font-size:16pt;font-weight:800;margin:0 0 3mm}
  #printTitle span{font-size:11pt;font-weight:600;color:#444;margin-left:4mm}
  #map{position:relative;inset:auto;width:404mm;height:250mm;border:1px solid #ccc}
  #legend{display:block!important;top:12mm;right:3mm;width:78mm;max-height:none;overflow:visible;box-shadow:none;border:1px solid #bbb}
  #legend summary .chev{display:none}
  #legend .lg{display:block!important}
  #notes{position:static;margin-top:2mm;padding:0;background:none;font-size:8pt}
  #printList{width:100%;border-collapse:collapse;font-size:9pt;margin-top:2mm}
  #printList td{padding:1px 3px;border-bottom:1px solid #eee}
  #printList td.r{text-align:right;font-variant-numeric:tabular-nums}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

</details>

<div id="controls">
  <div class="cgroup">
    <button class="icon-btn" id="zIn" type="button" aria-label="拡大"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
    <button class="icon-btn" id="zOut" type="button" aria-label="縮小"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13H5v-2h14z"/></svg></button>
  </div>
  <div class="cgroup">
    <button class="icon-btn" id="north" type="button" aria-label="方位をリセット（北を上に）"><svg id="compassIcon" width="22" height="22" viewBox="0 0 24 24"><path fill="#C8412F" d="M12 2 7.5 12h9z"/><path fill="#9aa0a6" d="M12 22l4.5-10h-9z"/></svg></button>
  </div>
  <div class="cgroup">
    <button class="icon-btn" id="custBtn" type="button" aria-pressed="true" aria-label="来店客を表示／非表示"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#D81B27" stroke="#fff" stroke-width="2"/></svg></button>
  </div>
  <div class="cgroup">
    <button class="icon-btn" id="geo" type="button" aria-label="現在地を表示"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 3A9 9 0 0 0 13 3.1V1h-2v2.1A9 9 0 0 0 3.1 11H1v2h2.1a9 9 0 0 0 7.9 7.9V23h2v-2.1a9 9 0 0 0 7.9-7.9H23v-2h-2.1zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg></button>
  </div>
</div>

<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('mapdata').textContent);

/* ---------- 定数・ユーティリティ ---------- */
const LOCAL_FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",YuGothic,Meiryo,sans-serif';
const F_REG = ['Noto Sans Regular'], F_BOLD = ['Noto Sans Bold'];
const LAYERS = ['A', 'B', 'C'];
// 層の意味（凡例・一覧見出し用）。色と層名は mapdata.json から取る
const L = {
  A: { desc: '自店シェアが2位の3倍以上。毎回必ず撒く', ink: '#9E2F20', tint: '#F8E3E0' },
  B: { desc: '2位の1.73〜3倍。毎回撒く', ink: '#8A4A0C', tint: '#FBEBDA' },
  C: { desc: 'シェアは劣勢だが実来店あり。反応を見る', ink: '#2B646E', tint: '#E0EFF1' },
};
LAYERS.forEach(k => {
  const items = D.areas.filter(a => a.layer === k);
  Object.assign(L[k], {
    color: items[0].color, name: items[0].layerName, count: items.length,
    mai: items.reduce((s, a) => s + a.mai, 0), hit: 0,
  });
});
const RIVAL_COLOR = { '大吉': '#5A3FA0', 'おたからや': '#B4306E' };
const VISIT_COLOR = '#D81B27';
// 来店客データ（来店客マップと同じ元データ。読めない場合はECS集計の赤ピンを使う）
const CUSTOMERS_URL = 'https://kohsuke0219-crypto.github.io/nagoya-customer-map/data/customers.json';
const SRC_COLOR = {
  '新聞折込チラシ': '#D81B27', 'ネット検索': '#1E88A8', '通りすがり': '#7A8894', '通りがかり': '#4A5A68',
  '通りすがり　看板見て': '#46A0C8', 'ご紹介': '#B4306E', 'CM・テレビ': '#5A3FA0', '顧客': '#2E7D4F',
  '再来店': '#67A83E', '近所だから': '#E2872B', 'その他': '#9aa0a6',
};
const srcColor = s => SRC_COLOR[s] || SRC_COLOR['その他'];
let CUST = [];      // {lat,lng,src,age,amount,date}（座標は約200mに丸め済み）
let custByArea = {}; // 地区番号 → {total, bySrc}
const BRAND_LABEL = { '大吉': '買取大吉', 'おたからや': 'おたからや' };
const FOCUS_RIVAL = 'おたからや小幡店';
const byNo = new Map(D.areas.map(a => [a.no, a]));
const fmt = n => Number(n).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ll = p => [p[1], p[0]];
const $ = id => document.getElementById(id);
const mq = matchMedia('(max-width:767px)');
const isMobile = () => mq.matches;
const PEEK = 132;
let sheetState = 'peek';
// ピンの表示状態（簡易地図の描画が先に走るため、ここで初期化しておく）
let visitsOn = false, custOn = true;

function kmBetween(a, b) {
  const r = Math.PI / 180, dLat = (b[1] - a[1]) * r, dLng = (b[0] - a[0]) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(s));
}
const storeLL = [D.store.lng, D.store.lat];

// 地区ピンの表示位置。代表点が店舗の星と重なる地区（①大森一丁目）だけ、
// 代表点と「店舗から最も遠い頂点」の中点に置いて星と番号が重ならないようにする
function pinPos(a) {
  const c = [a.lng, a.lat];
  if (kmBetween(c, storeLL) > 0.1) return c;
  let far = c, fd = -1;
  a.poly.forEach(p => { const v = ll(p), d = kmBetween(v, storeLL); if (d > fd) { fd = d; far = v; } });
  return [(c[0] + far[0]) / 2, (c[1] + far[1]) / 2];
}
const pinByNo = new Map(D.areas.map(a => [a.no, pinPos(a)]));

function circle(center, rKm, n = 128) {
  const [lng, lat] = center, dLat = rKm / 110.574, dLng = rKm / (111.320 * Math.cos(lat * Math.PI / 180));
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n * 2 * Math.PI; pts.push([lng + dLng * Math.sin(t), lat + dLat * Math.cos(t)]); }
  return pts;
}

/* ---------- GeoJSON ---------- */
const fc = features => ({ type: 'FeatureCollection', features });
const point = (coord, props, id) => ({ type: 'Feature', id, properties: props, geometry: { type: 'Point', coordinates: coord } });
const line = (coords, props, id) => ({ type: 'Feature', id, properties: props, geometry: { type: 'LineString', coordinates: coords } });

const G = {
  areas: fc(D.areas.map(a => {
    const ring = a.poly.map(ll); ring.push(ring[0]);
    return { type: 'Feature', id: a.no, properties: { no: a.no, name: a.name, layer: a.layer, color: a.color }, geometry: { type: 'Polygon', coordinates: [ring] } };
  })),
  pins: fc(D.areas.map(a => point(pinByNo.get(a.no), { no: a.no, name: a.name, layer: a.layer, maiText: fmt(a.mai) + '枚' }, a.no))),
  store: fc([point(storeLL, { name: D.store.name })]),
  rivals: fc(D.rivals.map((r, i) => point([r.lng, r.lat], {
    idx: i, name: r.name, brand: r.brand, kind: r.brand === 'おたからや' ? 'otakara' : 'daikichi',
    focus: r.name === FOCUS_RIVAL, color: RIVAL_COLOR[r.brand] || '#555',
  }, i + 1))),
  rivers: fc(D.rivers.map((r, i) => line(r.pts.map(ll), { name: r.name, main: r.name === '矢田川' }, i + 1))),
  bridges: fc(D.bridges.map((b, i) => point([b.lng, b.lat], { idx: i, name: b.name }, i + 1))),
  rail: fc([line(D.rail.pts.map(ll), { name: D.rail.name }, 1)]),
  stations: fc(D.stations.map((s, i) => point([s.lng, s.lat], { idx: i, name: s.name }, i + 1))),
  rings: fc(D.rings.map((r, i) => line(circle(storeLL, r), { r }, i + 1))),
  customers: fc([]),
  // 来店客（町丁目の代表点。同じ町の複数件は重ならないよう少しずらす）
  visits: fc((D.visits || []).flatMap((v, i) => Array.from({ length: v.n }, (_, j) => {
    const t = j / Math.max(1, v.n) * 2 * Math.PI, r = v.n > 1 ? 0.00025 : 0;
    return point([v.lng + r * Math.sin(t) * 1.22, v.lat + r * Math.cos(t)], { town: v.town, n: v.n }, i * 100 + j + 1);
  }))),
  ringLabels: fc(D.rings.map((r, i) => {
    const dLng = r / (111.320 * Math.cos(storeLL[1] * Math.PI / 180));
    return point([storeLL[0] + dLng, storeLL[1]], { label: r + 'km' }, i + 1); // 真東の円周上
  })),
};

const areaBounds = (() => {
  const xs = [], ys = [];
  D.areas.forEach(a => a.poly.forEach(p => { ys.push(p[0]); xs.push(p[1]); }));
  return [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];
})();

/* ---------- 画面のすき間計算 ---------- */
const topbar = $('topbar'), panel = $('panel'), panelBody = $('panelBody'), list = $('list'), card = $('card');
function occluded() {
  // 地図上でUIに隠れていない領域 {left, top, right, bottom}（px）
  const W = innerWidth, H = innerHeight;
  if (isMobile()) {
    const top = topbar.getBoundingClientRect().bottom;
    const sheetTop = H - sheetVisible(sheetState);
    return { left: 0, top, right: W, bottom: sheetTop };
  }
  return { left: panel.getBoundingClientRect().right, top: 0, right: W, bottom: H };
}
function fitPadding() {
  if (isMobile()) {
    const o = occluded();
    return { top: Math.round(o.top) + 16, bottom: Math.round(innerHeight - o.bottom) + 16, left: 16, right: 64 }; // 右は操作ボタン分
  }
  const left = Math.round(panel.getBoundingClientRect().right);
  const lg = $('legend').getBoundingClientRect();
  return { top: 60, bottom: 90, left: left + 60, right: Math.round(innerWidth - lg.left) + 24 };
}

/* ---------- 地図 ---------- */
// 地図が作れない環境（オフライン、外部スクリプトを禁止したプレビュー等）でも一覧・カードは使えるようにする
let map = null;
function showMapError(msg, simple) {
  if ($('mapError')) return;
  const pos = isMobile() ? 'top:112px;left:8px;right:120px' : `top:12px;left:${Math.round(panel.getBoundingClientRect().right) + 16}px;right:290px`;
  const head = simple ? '簡易表示（背景地図なし）' : '背景地図を表示できません';
  document.body.insertAdjacentHTML('beforeend', `<div id="mapError" title="${esc(msg)}" style="position:absolute;${pos};z-index:4;padding:8px 12px;background:rgba(255,255,255,.95);border-radius:10px;box-shadow:var(--shadow);font-size:12px;line-height:1.6;color:#3c4043">
    <b>${head}</b>：この画面では地図ライブラリが動きません。ChromeやEdgeで index.html を開くと、通常の地図で表示されます（要インターネット接続）。</div>`);
}

/* ---------- 簡易地図（MapLibre が使えない環境用の SVG 描画） ---------- */
const FB = { vb: null, W: 0, H: 0 };
function renderFallback() {
  const host = $('map');
  host.innerHTML = '';
  const W = host.clientWidth || innerWidth, H = host.clientHeight || innerHeight;
  const merc = (lng, lat) => { const s = Math.sin(lat * Math.PI / 180); return [(lng + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)]; };
  const pts = [];
  D.areas.forEach(a => a.poly.forEach(p => pts.push(merc(p[1], p[0]))));
  pts.push(merc(D.store.lng, D.store.lat));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = fitPadding();
  const aw = Math.max(100, W - pad.left - pad.right), ah = Math.max(100, H - pad.top - pad.bottom);
  const k = Math.min(aw / (x1 - x0), ah / (y1 - y0));
  const P = (lng, lat) => { const [x, y] = merc(lng, lat); return [pad.left + aw / 2 + (x - (x0 + x1) / 2) * k, pad.top + ah / 2 + (y - (y0 + y1) / 2) * k]; };
  const pl = arr => arr.map(p => P(p[1], p[0]).map(v => v.toFixed(1)).join(',')).join(' ');
  const NS = 'vector-effect="non-scaling-stroke"';
  let s = `<svg id="fbSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="position:absolute;inset:0;width:100%;height:100%;background:#f2f3f5;touch-action:none;cursor:grab;font-family:${LOCAL_FONT.replace(/"/g, "'")}">`;
  D.rings.forEach(r => { s += `<polyline points="${pl(circle(storeLL, r, 96).map(q => [q[1], q[0]]))}" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 4" ${NS}/>`; });
  D.rivers.forEach(r => { s += `<polyline points="${pl(r.pts)}" fill="none" stroke="#2F7FC1" stroke-width="${r.name === '矢田川' ? 7 : 2.5}" stroke-linecap="round" stroke-linejoin="round" ${NS}/>`; });
  s += `<polyline points="${pl(D.rail.pts)}" fill="none" stroke="#1f2328" stroke-width="4.5" ${NS}/><polyline points="${pl(D.rail.pts)}" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="4 4" ${NS}/>`;
  D.areas.forEach(a => {
    s += `<g class="fb-a" data-no="${a.no}" data-layer="${a.layer}" style="cursor:pointer"><polygon points="${pl(a.poly)}" fill="${a.color}" fill-opacity=".4" stroke="${a.color}" stroke-width="1.6" ${NS}/></g>`;
  });
  const yd = D.rivers.find(r => r.name === '矢田川');
  if (yd) { const [lx, ly] = P(yd.pts[6][1], yd.pts[6][0]); s += `<text x="${lx}" y="${ly + 18}" font-size="14" font-weight="800" fill="#17548a" stroke="#fff" stroke-width="3" paint-order="stroke">矢田川</text>`; }
  D.stations.forEach(st => { const [x, y] = P(st.lng, st.lat); s += `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="#1f2328" stroke-width="2"/>`; });
  D.rivals.forEach(r => {
    const [x, y] = P(r.lng, r.lat), c = RIVAL_COLOR[r.brand] || '#555', z = r.name === FOCUS_RIVAL ? 10 : 7;
    s += `<path d="M${x} ${y - z}L${x + z} ${y} ${x} ${y + z} ${x - z} ${y}z" fill="${c}" stroke="#fff" stroke-width="2"/>`;
    if (r.name === FOCUS_RIVAL) s += `<text x="${x + 14}" y="${y + 4}" font-size="12.5" font-weight="800" fill="${c}" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(r.name)}</text>`;
  });
  D.areas.forEach(a => {
    const [x, y] = P(...pinByNo.get(a.no));
    s += `<g class="fb-a fb-pin" data-no="${a.no}" data-layer="${a.layer}" style="cursor:pointer">
      <text x="${x}" y="${y + 27}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(a.name)}</text>
      <text x="${x}" y="${y + 41}" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2328" stroke="#fff" stroke-width="3" paint-order="stroke">${fmt(a.mai)}枚</text>
      <circle cx="${x}" cy="${y}" r="12" fill="${a.color}" stroke="#fff" stroke-width="2"/>
      <text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">${a.no}</text></g>`;
  });
  (custOn ? CUST : []).forEach(c => {
    const [x, y] = P(c.lng, c.lat);
    s += `<circle class="fb-cust" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${srcColor(c.src)}" stroke="#fff" stroke-width="1.6"><title>${esc(c.src)} ${esc(c.date)}</title></circle>`;
  });
  (visitsOn ? (D.visits || []) : []).forEach(v => {
    for (let j = 0; j < v.n; j++) {
      const t = j / Math.max(1, v.n) * 2 * Math.PI, r = v.n > 1 ? 0.00025 : 0;
      const [x, y] = P(v.lng + r * Math.sin(t) * 1.22, v.lat + r * Math.cos(t));
      s += `<circle class="fb-visit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${VISIT_COLOR}" stroke="#fff" stroke-width="1.6"><title>${esc(v.town)} 来店${v.n}件</title></circle>`;
    }
  });
  const [sx, sy] = P(D.store.lng, D.store.lat);
  const star = Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 7 : 16, t = -Math.PI / 2 + i * Math.PI / 5; return `${(sx + r * Math.cos(t)).toFixed(1)},${(sy + r * Math.sin(t)).toFixed(1)}`; }).join(' ');
  s += `<polygon points="${star}" fill="#E8B521" stroke="#6b4a00" stroke-width="1.5" stroke-linejoin="round"/><text x="${sx}" y="${sy + 32}" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4a3500" stroke="#fff" stroke-width="3.5" paint-order="stroke">守山大森店</text></svg>`;
  host.insertAdjacentHTML('beforeend', s);
  FB.W = W; FB.H = H; FB.vb = [0, 0, W, H];
  const svg = $('fbSvg');
  const setVB = () => svg.setAttribute('viewBox', FB.vb.map(v => v.toFixed(1)).join(' '));
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); return [FB.vb[0] + (cx - r.left) / r.width * FB.vb[2], FB.vb[1] + (cy - r.top) / r.height * FB.vb[3]]; };
  FB.zoom = (f, cx = innerWidth / 2, cy = innerHeight / 2) => {
    const [px, py] = toSvg(cx, cy), w = Math.min(FB.W * 4, Math.max(FB.W / 8, FB.vb[2] / f)), h = w * FB.H / FB.W;
    FB.vb = [px - (px - FB.vb[0]) * w / FB.vb[2], py - (py - FB.vb[1]) * h / FB.vb[3], w, h]; setVB();
  };
  svg.addEventListener('wheel', e => { e.preventDefault(); FB.zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY); }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vb: FB.vb.slice(), moved: false }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    const r = svg.getBoundingClientRect();
    FB.vb = [drag.vb[0] - dx / r.width * drag.vb[2], drag.vb[1] - dy / r.height * drag.vb[3], drag.vb[2], drag.vb[3]]; setVB();
  });
  svg.addEventListener('pointerup', e => {
    const d = drag; drag = null;
    if (!d || d.moved) return;
    const hit = document.elementsFromPoint(e.clientX, e.clientY).map(el => el.closest && el.closest('.fb-a')).find(Boolean);
    if (hit) select(+hit.dataset.no, 'map'); else if (sel != null) deselect();
  });
}

function addCanvasImage(id, w, h, draw) {
  const r = 2, c = document.createElement('canvas');
  c.width = w * r; c.height = h * r;
  const x = c.getContext('2d'); x.scale(r, r); draw(x, w, h);
  map.addImage(id, x.getImageData(0, 0, w * r, h * r), { pixelRatio: r });
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function addImages() {

    addCanvasImage('pin-' + k, 30, 30, x => {
      x.beginPath(); x.arc(15, 15, 12, 0, Math.PI * 2);
      x.fillStyle = col; x.fill(); x.lineWidth = 2; x.strokeStyle = '#fff'; x.stroke();
    });
    addCanvasImage('pin-' + k + '-sel', 46, 46, x => {
      x.save(); x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = 6; x.shadowOffsetY = 1;
      x.beginPath(); x.arc(23, 23, 18, 0, Math.PI * 2); x.fillStyle = col; x.fill(); x.restore();
      x.beginPath(); x.arc(23, 23, 17, 0, Math.PI * 2); x.lineWidth = 4; x.strokeStyle = '#fff'; x.stroke();
    });
  });
  addCanvasImage('store', 40, 40, x => {
    const cx = 20, cy = 21, R = 17, r = 7.5;
    x.beginPath();
    for (let i = 0; i < 10; i++) { const rad = i % 2 ? r : R, a = -Math.PI / 2 + i * Math.PI / 5; x.lineTo(cx + rad * Math.cos(a), cy + rad * Math.sin(a)); }
    x.closePath(); x.lineJoin = 'round';
    x.lineWidth = 5; x.strokeStyle = '#fff'; x.stroke();
    x.fillStyle = '#E8B521'; x.fill();
    x.lineWidth = 1.6; x.strokeStyle = '#6b4a00'; x.stroke();
  });
  const diamond = (id, size, col, halo) => addCanvasImage(id, size, size, (x, w) => {
    const c = w / 2, s = halo ? w / 2 - 8 : w / 2 - 2;
    if (halo) {
      x.beginPath(); x.arc(c, c, w / 2 - 1.5, 0, Math.PI * 2);

    }
    x.beginPath(); x.moveTo(c, c - s); x.lineTo(c + s, c); x.lineTo(c, c + s); x.lineTo(c - s, c); x.closePath();
    x.fillStyle = col; x.fill(); x.lineWidth = 2; x.strokeStyle = '#fff'; x.stroke();
  });

}

/* ---------- 来店客データの読み込み ---------- */
function inPoly(lng, lat, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
let custGenerated = '', custFetchedAt = 0, custError = false;
async function loadCustomers() {
  let raw;
  try {
    const r = await fetch(CUSTOMERS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    raw = j.customers || [];
    custGenerated = j.generated_at || '';
    custFetchedAt = Date.now();
    custError = false;
  } catch (e) { custError = true; return false; }
  custByArea = {};
  const seen = {};
  CUST = raw.filter(c => c.lat && c.lng).map(c => {
    const src = c.newspaper || 'その他';
    const a = D.areas.find(a => inPoly(c.lng, c.lat, a.poly));
    if (a) { const g = (custByArea[a.no] ||= { total: 0, bySrc: {} }); g.total++; g.bySrc[src] = (g.bySrc[src] || 0) + 1; }
    // 個人宅が特定できないよう、約200mの格子に丸めてから表示する
    const glat = Math.round(c.lat / 0.0018) * 0.0018, glng = Math.round(c.lng / 0.0022) * 0.0022;
    const k = glat.toFixed(4) + ',' + glng.toFixed(4);
    const i = (seen[k] = (seen[k] || 0) + 1) - 1;
    const t = i * 2.4, r2 = i ? 0.00022 : 0;
    return { lat: glat + r2 * Math.cos(t), lng: glng + r2 * Math.sin(t) * 1.22, src, age: c.age_group || '', amount: c.amount || '', date: c.visit_date || '', area: a ? a.no : null };
  });
  return CUST.length > 0;
}

           ${custByArea[a.no] ? `<div class="s">${Object.entries(custByArea[a.no].bySrc).sort((x, y) => y[1] - x[1]).map(([s, n]) => `<span style="color:${srcColor(s)};font-weight:700">●</span>${esc(s)} ${n}`).join(' ／ ')}</div>` : ''}</div>`}
    </div>`;

function select(no, src) {
  const a = byNo.get(no);
  if (!a) return;
  if (filterKey !== 'all' && filterKey !== a.layer) applyFilter('all');
  sel = no;
  if (ready) paintSelection();

  rowByNo.forEach((r, n) => { r.classList.toggle('active', n === no); r.classList.remove('flash'); });
  const row = rowByNo.get(no);

    if (sheetState === 'peek') setSheet('half');

const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const q = $('q'), suggest = $('suggest'), qClear = $('qClear');
let hits = [];
function renderSuggest() {
  const v = q.value.trim();
  qClear.hidden = !v;
  if (!v) { suggest.hidden = true; return; }
  hits = D.areas.filter(a => a.name.includes(v) || String(a.no) === v);
  suggest.innerHTML = hits.length
    ? hits.map(a => `<li><button type="button" role="option" data-no="${a.no}"><span class="nb" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;background:${a.color}">${a.no}</span>${esc(a.name)}<span class="sub">${a.layer} · ${fmt(a.mai)}枚</span></button></li>`).join('')
    : '<li class="empty">該当する地区がありません</li>';

  suggest.querySelectorAll('button').forEach(b => b.addEventListener('click', () => pick(+b.dataset.no)));
}
function pick(no) {
  q.value = byNo.get(no).name; qClear.hidden = false;
  suggest.hidden = true; q.blur();
  select(no, 'search');
}
q.addEventListener('input', renderSuggest);
q.addEventListener('focus', () => { if (q.value.trim()) renderSuggest(); });
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && hits.length && q.value.trim()) { e.preventDefault(); pick(hits[0].no); }
  else if (e.key === 'Escape') { suggest.hidden = true; q.blur(); }
  else if (e.key === 'ArrowDown' && !suggest.hidden) { const b = suggest.querySelector('button'); if (b) { e.preventDefault(); b.focus(); } }
});
suggest.addEventListener('keydown', e => {

  if (e.key === 'ArrowDown' && i < bs.length - 1) { e.preventDefault(); bs[i + 1].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? bs[i - 1] : q).focus(); }

/* ---------- ボトムシート（スマホ） ---------- */
const SHEET_ORDER = ['full', 'half', 'peek'];
function sheetY(state) {
  const H = panel.offsetHeight;
  if (state === 'full') return 0;
  if (state === 'half') return Math.max(0, H - Math.round(innerHeight * 0.52));
  return H - PEEK;
}
function sheetVisible(state) { return isMobile() ? panel.offsetHeight - sheetY(state) : 0; }
function setSheet(state) {
  sheetState = state; panel.dataset.state = state;
  if (!isMobile()) { panel.style.transform = ''; return; }
  panel.classList.remove('dragging');
  panel.style.transform = `translateY(${sheetY(state)}px)`;
}
(() => {
  const head = $('sheetHead');
  let drag = null;
  head.addEventListener('pointerdown', e => {
    if (!isMobile()) return;
    drag = { y0: e.clientY, t0: sheetY(sheetState), y: sheetY(sheetState), moved: false };
    head.setPointerCapture(e.pointerId);
    panel.classList.add('dragging');
  });
  head.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    if (Math.abs(dy) > 5) drag.moved = true;
    drag.y = Math.min(sheetY('peek'), Math.max(0, drag.t0 + dy));
    panel.style.transform = `translateY(${drag.y}px)`;
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    const i = SHEET_ORDER.indexOf(sheetState);
    if (!d.moved) return setSheet(sheetState === 'half' ? 'full' : 'half'); // タップ：半開き↔全開
    const dy = d.y - d.t0;
    if (dy < -40) return setSheet(SHEET_ORDER[Math.max(0, i - 1)]);
    if (dy > 40) return setSheet(SHEET_ORDER[Math.min(2, i + 1)]);
    setSheet(sheetState);
  };
  head.addEventListener('pointerup', end);
  head.addEventListener('pointercancel', end);
})();
mq.addEventListener('change', () => { setSheet(isMobile() ? 'peek' : sheetState); $('legend').open = !isMobile(); if (map) map.resize(); });
let fbTimer = null;
addEventListener('resize', () => {
  if (isMobile()) setSheet(sheetState);
  if (!map && FB.vb) { clearTimeout(fbTimer); fbTimer = setTimeout(() => { renderFallback(); fbFilter(filterKey === 'all' ? LAYERS : [filterKey]); fbHighlight(sel); }, 200); }
});

function showPopup(coord, html) { popup.setLngLat(coord).setHTML(html).addTo(map); }
const CLICK_LAYERS = ['store', 'customers', 'visits', 'rivals', 'stations', 'bridges', 'area-pin', 'area-fill'];
function hitTest(pt, pad) {
  const box = [[pt.x - pad, pt.y - pad], [pt.x + pad, pt.y + pad]];
  const layers = CLICK_LAYERS.filter(id => map.getLayer(id));
  const fs = map.queryRenderedFeatures(box, { layers });
  for (const id of CLICK_LAYERS) { const f = fs.find(x => x.layer.id === id); if (f) return f; }
  return null;
}
function bindMapEvents() {
  map.on('click', e => {

if (map) map.on('error', e => { if (!ready && e && e.error && /Failed to fetch|NetworkError|style/i.test(String(e.error.message))) showMapError('背景地図を読み込めませんでした。'); });
if (map) map.on('load', () => {
  localizeBasemap(); addImages(); addLayers(); bindMapEvents();
  ready = true;
  applyFilter(filterKey);
  if (sel != null) paintSelection();
  if (isMobile()) { const at = document.querySelector('.maplibregl-ctrl-attrib'); if (at) at.classList.remove('maplibregl-compact-show'); }
  refreshCustomers(false).then(() => { window.__custLoaded = CUST.length; });
  window.__ready = true;
});
})();
</script>
